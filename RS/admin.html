<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rossever · Panel</title>
  <meta name="theme-color" content="#F7ECF3" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="admin">
  <main class="wrap">

    <!-- Acceso -->
    <section id="gate" class="panel">
      <h1 class="h1">Panel de Ever</h1>
      <p class="subtitle">Inicia sesión para publicar.</p>

      <label class="field-label field-label--spaced" for="email">Correo</label>
      <input id="email" class="field" type="email" autocomplete="email" inputmode="email" />

      <label class="field-label field-label--spaced" for="pass">Contraseña</label>
      <input id="pass" class="field" type="password" autocomplete="current-password" />

      <p id="gateError" class="error-text hidden">Correo o contraseña incorrectos.</p>

      <button id="gateBtn" type="button" class="btn btn--block spaced">Entrar</button>
    </section>

    <!-- Panel -->
    <section id="panel" class="hidden">
      <div class="panel">
        <div class="row-between">
          <h1 class="h1">Publicar</h1>
          <button id="logoutBtn" type="button" class="link-btn">Salir</button>
        </div>

        <div class="seg spaced" role="radiogroup" aria-label="Tipo de publicación">
          <button type="button" class="seg-btn is-active" data-type="text" role="radio" aria-checked="true">Cartita</button>
          <button type="button" class="seg-btn" data-type="video" role="radio" aria-checked="false">Video</button>
        </div>

        <label id="contentLabel" class="field-label field-label--spaced" for="content">Tu mensaje</label>
        <textarea id="content" class="field" rows="6" placeholder="Escribe algo bonito para Rossi…"></textarea>
        <p id="hint" class="hint-text hidden">Pega un enlace de YouTube o un enlace directo a un archivo .mp4.</p>

        <button id="publishBtn" type="button" class="btn btn--block spaced">Publicar</button>
        <p id="msg" class="status-msg" role="status" aria-live="polite"></p>
        <p class="hint-text">A Rossi le llega una notificación al celular cuando publicas.</p>
      </div>

      <div class="panel spaced">
        <h2 class="h1">Publicadas</h2>
        <div id="postList" class="post-list" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
