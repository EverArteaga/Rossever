<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rossever</title>
  <meta name="theme-color" content="#F7ECF3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Rossever" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap wrap--feed">

    <!-- Encabezado -->
    <header class="hero">
      <p class="hero-sign">para Rossi, de Ever</p>
      <h1 class="hero-title">Rossever</h1>

      <section class="counter" aria-label="Tiempo juntos">
        <p class="counter-label">Llevamos juntos</p>
        <p class="counter-days" id="cDays" aria-live="off">0</p>
        <p class="counter-label counter-label--tight">días</p>
        <div class="counter-small" id="counterSmall">
          <span><b id="cHours">00</b> h</span>
          <span><b id="cMins">00</b> min</span>
          <span><b id="cSecs">00</b> s</span>
        </div>
      </section>
    </header>

    <!-- Feed -->
    <section id="feed" class="feed" aria-label="Detalles para ti">
      <p id="feedStatus" class="feed-status">Cargando tus detalles…</p>
    </section>

    <div id="pushBanner" class="push-banner hidden">
      <span>Activa las notificaciones para enterarte al momento.</span>
      <button id="pushBtn" type="button" class="btn">Activar notificaciones</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
